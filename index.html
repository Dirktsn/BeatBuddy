<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MetroNooo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2C3E50">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>MetroNooo 🎵</h1>
        </header>
        
        <div class="visualizer-container">
            <div id="pulse" class="pulse"></div>
        </div>

        <div class="bpm-display">
            <span id="bpm-value">120</span>
            <small>BPM</small>
        </div>

        <div class="controls">
            <button id="btn-minus" class="btn-round">-</button>
            <button id="btn-start" class="btn-main">START</button>
            <button id="btn-plus" class="btn-round">+</button>
        </div>

        <div class="extra-controls">
            <div class="section">
                <p>Tempo</p>
                <div class="btn-group">
                    <button class="btn-sec active" data-beats="4">4/4</button>
                    <button class="btn-sec" data-beats="2">2/4</button>
                    <button class="btn-sec" data-beats="6">6/8</button>
                </div>
            </div>
            <div class="section">
                
                <button id="btn-tap" class="btn-tap">TAP TEMPO</button>
            </div>
        </div>
    
        <footer>
            made by <a href="https://dirktsn.github.io/DirkWeb2/" target="_blank">DirkWeb</a>
        </footer>
    </div>
    <script src="assets/js/main.js"></script>
    <script>
    if("serviceWorker" in navigator){
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js");
      });
    }
    </script>
</body>
</html>
